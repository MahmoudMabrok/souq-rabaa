<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>استوديو سوق الرابعة — بورصة السادات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    :root { --bg:#121212; --panel:#1b1b1b; --line:#333; --txt:#eee; --muted:#9aa; --accent:#ffb300; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:Cairo,sans-serif; background:var(--bg); color:var(--txt); min-height:100vh; }
    .app { display:grid; grid-template-columns:360px 1fr 300px; min-height:100vh; }
    @media (max-width:1200px){ .app{grid-template-columns:1fr;} }
    .side,.lib{ background:var(--panel); overflow-y:auto; max-height:100vh; padding:14px; }
    .side{ border-left:1px solid var(--line); } .lib{ border-right:1px solid var(--line); }
    h1{ font-size:17px; color:var(--accent); margin-bottom:6px; }
    .hint{ font-size:12px; color:var(--muted); line-height:1.55; margin-bottom:10px; }
    label{ display:block; font-size:11px; color:#bbb; margin:8px 0 3px; }
    input,select{ width:100%; padding:7px 9px; border-radius:8px; border:1px solid #444; background:#222; color:#fff; font-family:inherit; font-size:13px; }
    .row2{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
    .row3{ display:grid; grid-template-columns:1fr 58px 58px; gap:5px; margin-bottom:6px; }
    button{ font-family:inherit; font-weight:800; border:0; border-radius:9px; padding:9px 10px; cursor:pointer; font-size:13px; }
    .btn-x{ background:#ff9800; color:#111; } .btn-ok{ background:#2e7d32; color:#fff; }
    .btn-d{ background:#333; color:#ddd; } .btn-danger{ background:#b71c1c; color:#fff; }
    .btns{ display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; } .btns button{ flex:1; min-width:90px; }
    .sec-box{ background:#151515; border:1px solid #2a2a2a; border-radius:10px; padding:8px; margin:8px 0; }
    .sec-head{ display:flex; gap:6px; align-items:center; margin-bottom:6px; }
    .item-ed{ background:#1f1f1f; border-radius:8px; padding:6px; margin-bottom:6px; }
    .item-ed .tools{ display:flex; gap:4px; margin-top:4px; }
    .item-ed .tools button{ padding:4px 7px; font-size:12px; }
    .status{ min-height:16px; font-size:12px; color:#8bc34a; text-align:center; }
    .lib h2{ font-size:14px; margin:8px 0; }
    .filters{ display:flex; gap:4px; flex-wrap:wrap; margin-bottom:8px; }
    .filters button{ padding:5px 8px; background:#2a2a2a; color:#ddd; font-size:12px; }
    .filters button.on{ background:#ef6c00; color:#111; }
    .cat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
    .cat-card{ background:#222; border:1px solid #333; border-radius:10px; padding:6px; text-align:center; cursor:pointer; font-size:12px; }
    .cat-card:hover{ border-color:#ff9800; } .cat-card .emo{ font-size:32px; }
    .tpl{ border:2px solid #333; border-radius:10px; padding:8px; margin-bottom:6px; cursor:pointer; background:#1a1a1a; }
    .tpl.on{ border-color:#ff9800; }
    .preview-wrap{ padding:16px; background:#242424; overflow:auto; }
    .toolbar{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:12px; }
    #flyer{ width:1080px; margin:0 auto; overflow:hidden; position:relative; color:#222; }
    #flyer.tpl-classic{ background:linear-gradient(#fff6d9,#ffe8b0); }
    #flyer.tpl-night{ background:linear-gradient(#1b2838,#0d1b2a); color:#fff; }
    #flyer.tpl-minimal{ background:#fafafa; }
    #flyer.tpl-souq{ background:linear-gradient(#fff3e0,#ffe0b2); }
    #flyer.tpl-fresh{ background:linear-gradient(#e8f5e9,#c8e6c9); }
    .header{ position:relative; height:280px; }
    .tpl-classic .header{ background:linear-gradient(180deg,rgba(255,236,179,.5),#fff6d9),radial-gradient(circle at 80% 20%,#ffcc80,transparent 40%),#ffecb3; }
    .tpl-night .header{ background:radial-gradient(circle at 70% 20%,#30465f,#0d1b2a); }
    .tpl-minimal .header{ background:#fff; border-bottom:4px solid #111; height:180px; }
    .tpl-souq .header{ background:linear-gradient(#ff7043,#d84315); }
    .tpl-fresh .header{ background:linear-gradient(#66bb6a,#2e7d32); }
    .badge-today{ position:absolute; top:18px; right:20px; z-index:3; background:#e31c23; color:#fff; font-weight:900; font-size:24px; padding:6px 16px; border-radius:8px; transform:rotate(-7deg); }
    .wood-sign{ position:absolute; z-index:4; top:50px; left:50%; transform:translateX(-50%); width:520px; text-align:center; }
    .wood-plank{ background:linear-gradient(#c48a4a,#8b5a2b 40%,#6d4018); border:6px solid #5c3a1e; border-radius:16px; padding:8px 16px 16px; box-shadow:0 12px 0 #3e2410; }
    .tpl-minimal .wood-plank,.tpl-night .wood-plank,.tpl-souq .wood-plank,.tpl-fresh .wood-plank{ background:transparent; border:0; box-shadow:none; }
    .souq-word{ font-size:34px; font-weight:900; color:#2e7d32; }
    .tpl-night .souq-word,.tpl-souq .souq-word,.tpl-fresh .souq-word{ color:#fff; }
    .rabaa-word{ font-size:78px; font-weight:900; line-height:.85; color:#ff3d00; text-shadow:3px 3px 0 #fff,5px 7px 0 #b71c1c; }
    .tpl-night .rabaa-word{ color:#ffd54f; text-shadow:0 4px 0 #000; }
    .tpl-minimal .rabaa-word{ color:#111; text-shadow:none; font-size:64px; }
    .tpl-souq .rabaa-word,.tpl-fresh .rabaa-word{ color:#fff; text-shadow:0 4px 0 #0004; }
    .hang-left,.circle-right{ position:absolute; z-index:4; font-weight:800; text-align:center; }
    .hang-left{ top:90px; right:22px; width:150px; background:#f3e0b8; border:4px solid #8b5a2b; border-radius:8px; padding:10px; font-size:14px; }
    .circle-right{ top:70px; left:22px; width:150px; height:150px; border-radius:50%; background:radial-gradient(circle at 30% 30%,#fff,#ffe082); border:5px solid #fff; display:flex; align-items:center; justify-content:center; padding:12px; font-size:14px; color:#b71c1c; }
    .tpl-night .hang-left{ background:#263445; color:#fff; border-color:#ffd54f; }
    .tpl-night .circle-right{ background:#1b2838; color:#ffd54f; border-color:#ffd54f; }
    .red-ribbon{ position:relative; z-index:5; margin:-28px auto 0; width:78%; background:linear-gradient(#ff1744,#c62828); color:#fff; text-align:center; padding:8px 16px 12px; font-size:26px; font-weight:900; clip-path:polygon(3% 0,97% 0,100% 50%,97% 100%,3% 100%,0 50%); }
    .tpl-minimal .red-ribbon{ clip-path:none; background:#111; }
    .tpl-fresh .red-ribbon{ background:linear-gradient(#43a047,#1b5e20); }
    .tpl-night .red-ribbon{ background:linear-gradient(#ffc107,#ff8f00); color:#111; }
    .bar{ margin:12px 22px 8px; text-align:center; padding:7px 14px; border-radius:30px; color:#fff; font-weight:900; font-size:22px; }
    .bar.green{ background:linear-gradient(#66bb6a,#2e7d32); } .bar.purple{ background:linear-gradient(#ab47bc,#6a1b9a); }
    .bar.orange{ background:linear-gradient(#ff9800,#ef6c00); } .bar.blue{ background:linear-gradient(#42a5f5,#1565c0); }
    .bar.brown{ background:linear-gradient(#8d6e63,#5d4037); }
    .grid{ display:grid; gap:10px; padding:6px 20px 16px; }
    .cols-2{ grid-template-columns:repeat(2,1fr);} .cols-3{ grid-template-columns:repeat(3,1fr);}
    .cols-4{ grid-template-columns:repeat(4,1fr);} .cols-5{ grid-template-columns:repeat(5,1fr);}
    .card{ background:#fff; border:3px solid #c8e6c9; border-radius:14px; padding:6px; text-align:center; position:relative; min-height:168px; cursor:grab; }
    .tpl-night .card{ background:#1b2838; border-color:#415a77; color:#fff; }
    .tpl-minimal .card{ border:1px solid #ddd; }
    .card.dragging{ opacity:.55; }
    .card h3{ font-size:16px; font-weight:800; margin-bottom:2px; color:#1b5e20; }
    .tpl-night .card h3{ color:#c5e1a5; }
    .pic{ height:86px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:54px; overflow:hidden; position:relative; }
    .pic img{ width:100%; height:100%; object-fit:cover; position:absolute; inset:0; }
    .price{ position:absolute; left:6px; bottom:6px; background:#ffd54f; border:2px solid #f9a825; border-radius:8px; min-width:54px; padding:2px 5px 3px; font-weight:900; color:#b71c1c; line-height:1.1; }
    .price .from,.price .to,.price .unit{ font-size:10px; display:block; } .price .num{ font-size:20px; display:block; }
    .tag{ position:absolute; top:6px; right:6px; background:#e91e63; color:#fff; font-size:11px; font-weight:800; padding:2px 7px; border-radius:10px; }
    .footer{ background:#5c3a1e; color:#ffe082; text-align:center; padding:9px; font-weight:700; font-size:13px; }
    .tpl-night .footer{ background:#0d1b2a; color:#ffd54f; } .tpl-minimal .footer{ background:#111; color:#fff; }
    .tpl-fresh .footer{ background:#1b5e20; color:#fff; } .tpl-souq .footer{ background:#bf360c; color:#fff; }
    .modal-bg{ position:fixed; inset:0; background:#0008; display:none; align-items:center; justify-content:center; z-index:50; }
    .modal-bg.show{ display:flex; }
    .modal{ background:#1e1e1e; border:1px solid #444; border-radius:14px; padding:16px; width:min(420px,92vw); }
  </style>
</head>
<body>
<div class="app">
  <aside class="side">
    <h1>استوديو سوق الرابعة</h1>
    <p class="hint">اسحب الكرت. احذف أو تراجع. أضف صنفاً من المكتبة أو قسماً. اختر قالباً ثم صدّر صورة.</p>
    <label>القالب</label><select id="templateSel"></select>
    <label>عنوان السوق</label><input id="titleSouq" />
    <label>الاسم البارز</label><input id="titleName" />
    <label>الشريط</label><input id="ribbon" />
    <label>التاريخ / الملصق</label><input id="dateText" />
    <label>الدائرة</label><input id="circleText" />
    <label>اللافتة</label><input id="hangText" />
    <label>التذييل</label><input id="footerText" />
    <div class="btns">
      <button class="btn-x" onclick="exportImage()">تصدير PNG</button>
      <button class="btn-ok" onclick="saveData()">حفظ</button>
      <button class="btn-d" onclick="undo()">تراجع</button>
      <button class="btn-d" onclick="resetData()">إعادة ضبط</button>
    </div>
    <div class="btns">
      <button class="btn-ok" onclick="addSection()">+ قسم جديد</button>
      <button class="btn-d" onclick="openCustomItem()">+ صنف حر</button>
    </div>
    <div class="status" id="status"></div>
    <div id="sectionsEditor"></div>
  </aside>
  <div class="preview-wrap">
    <div class="toolbar">
      <button class="btn-x" onclick="exportImage()">تصدير الإعلان كصورة</button>
      <button class="btn-d" onclick="undo()">تراجع</button>
    </div>
    <div id="flyer" class="tpl-classic"></div>
  </div>
  <aside class="lib">
    <h2>القوالب</h2><div id="tplList"></div>
    <h2>مكتبة الأصناف</h2>
    <input id="catSearch" placeholder="ابحث: طماطم، مانجو..." />
    <div class="filters" id="catFilters"></div>
    <p class="hint">اضغط للإضافة، أو اسحب إلى القسم.</p>
    <div class="cat-grid" id="catGrid"></div>
  </aside>
</div>
<div class="modal-bg" id="modal">
  <div class="modal">
    <h3>صنف جديد</h3>
    <label>الاسم</label><input id="cName" />
    <div class="row2"><div><label>من</label><input id="cMin" value="10" /></div><div><label>إلى</label><input id="cMax" /></div></div>
    <label>إيموجي</label><input id="cEmoji" value="🛒" />
    <label>ملصق</label><input id="cTag" />
    <div class="btns"><button class="btn-ok" onclick="confirmCustomItem()">إضافة</button><button class="btn-d" onclick="closeModal()">إلغاء</button></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
