<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>قالب سوق الرابعة — بورصة السادات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Cairo,sans-serif;background:#1a1a1a;color:#eee}
.app{display:grid;grid-template-columns:330px 1fr;min-height:100vh}
@media(max-width:980px){.app{grid-template-columns:1fr}}
.editor{background:#141414;padding:16px 14px 40px;overflow-y:auto;max-height:100vh;border-left:1px solid #333}
h1{font-size:18px;color:#ffd54f;margin-bottom:6px}
.hint{font-size:12px;color:#aaa;line-height:1.6;margin-bottom:12px}
label{display:block;font-size:12px;color:#bbb;margin:8px 0 4px}
input{width:100%;padding:8px;border-radius:8px;border:1px solid #444;background:#222;color:#fff;font-family:inherit}
.row3{display:grid;grid-template-columns:1fr 64px 64px;gap:6px;margin-bottom:6px}
button{font-family:inherit;font-weight:800;border:0;border-radius:10px;padding:10px;cursor:pointer;font-size:14px}
.btn-x{background:#ff7a00;color:#111}.btn-ok{background:#2e7d32;color:#fff}.btn-d{background:#333;color:#ddd}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.btns button{flex:1}
.status{min-height:16px;font-size:12px;color:#8bc34a;text-align:center}
.sec-title{margin:12px 0 6px;padding:6px 10px;background:#2e7d32;border-radius:6px;font-size:13px;font-weight:800}
.sec-title.p{background:#6a1b9a}
.tpls,.price-tpls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tpl{border:2px solid #333;border-radius:10px;overflow:hidden;cursor:pointer;background:#222}
.tpl.on{border-color:#ff9800}.tpl img{width:100%;height:72px;object-fit:cover;display:block}
.tpl span{display:block;padding:4px 6px;font-size:11px;font-weight:800}
.thumb{height:72px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#111}
.preview-wrap{padding:20px;background:#2b2b2b;overflow:auto}
.toolbar{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
#flyer{width:1080px;margin:0 auto;background:linear-gradient(#fff6d9,#ffe8b0);color:#222;overflow:hidden;position:relative;box-shadow:0 20px 60px #0007}
.header{position:relative;height:420px;overflow:hidden}
.header-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none}
.tpl-classic .header{background:linear-gradient(180deg,rgba(0,0,0,.12),transparent 40%,#fff6d9 100%),radial-gradient(ellipse at 20% 40%,#ffcc80,transparent 50%),#ffecb3}
.tpl-masry .header{background:linear-gradient(#e8c27a,#c48a4a)}
.tpl-night .header{background:radial-gradient(circle at 70% 20%,#30465f,#0d1b2a)}
.tpl-farm .header{background:linear-gradient(#81c784,#2e7d32)}
.tpl-souq .header{background:linear-gradient(#ff7043,#bf360c)}
.tpl-minimal .header{background:#fff;height:280px;border-bottom:4px solid #111}
#flyer.tpl-night{background:linear-gradient(#1b2838,#0d1b2a)}
#flyer.tpl-farm{background:linear-gradient(#e8f5e9,#c8e6c9)}
#flyer.tpl-souq{background:linear-gradient(#fff3e0,#ffccbc)}
#flyer.tpl-minimal{background:#fafafa}
.drag{position:absolute;z-index:5;cursor:move;user-select:none;touch-action:none}
.drag.hold{outline:2px dashed #ff9800;z-index:9}
.badge-today{background:#e31c23;color:#fff;font-weight:900;font-size:28px;padding:8px 22px 10px;border-radius:8px;transform:rotate(-8deg);box-shadow:4px 6px 0 #8b0000}
.mega{font-size:54px}.wood-sign{width:560px;text-align:center}
.wood-plank{background:linear-gradient(#c48a4a,#8b5a2b 40%,#6d4018);border:6px solid #5c3a1e;border-radius:18px;padding:10px 20px 22px;box-shadow:0 14px 0 #3e2410}
.souq-word{font-size:42px;font-weight:900;color:#2e7d32;letter-spacing:6px;text-shadow:2px 2px 0 #fff,0 4px 0 #1b5e20;line-height:1}
.rabaa-word{font-size:92px;font-weight:900;line-height:.85;color:#ff3d00;text-shadow:3px 3px 0 #fff,6px 8px 0 #b71c1c}
.hang-left{width:168px;background:#f3e0b8;border:4px solid #8b5a2b;border-radius:8px;padding:12px 10px;text-align:center;font-weight:800;font-size:16px;line-height:1.45;box-shadow:0 8px 0 #5c3a1e}
.circle-right{width:176px;height:176px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#ffe082);border:6px solid #fff;box-shadow:0 8px 0 #c62828;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font-weight:900;font-size:16px;line-height:1.4;color:#b71c1c}
.basket{font-size:72px}
.red-ribbon{position:relative;z-index:6;margin:-36px auto 0;width:78%;background:linear-gradient(#ff1744,#c62828);color:#fff;text-align:center;padding:10px 20px 14px;font-size:30px;font-weight:900;clip-path:polygon(3% 0,97% 0,100% 50%,97% 100%,3% 100%,0 50%);text-shadow:0 3px 0 #7f0000}
.bar{margin:14px 24px 10px;text-align:center;padding:8px 16px;border-radius:30px;color:#fff;font-weight:900;font-size:26px}
.bar.green{background:linear-gradient(#66bb6a,#2e7d32)}.bar.purple{background:linear-gradient(#ab47bc,#6a1b9a)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:8px 22px 18px}.grid.three{grid-template-columns:repeat(3,1fr)}
.card{background:#fff;border:3px solid #c8e6c9;border-radius:18px;padding:10px 8px 12px;text-align:center;position:relative;min-height:196px;box-shadow:0 6px 0 #e8f5e9}
.card h3{font-size:18px;font-weight:900;margin-bottom:6px;color:#1b5e20}
.pic{height:110px;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.prod{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:64px}
.price{position:absolute;left:10px;bottom:10px;background:#ffd54f;border:2px solid #f9a825;border-radius:10px;min-width:62px;padding:3px 7px 5px;font-weight:900;color:#b71c1c;line-height:1.15;box-shadow:2px 3px 0 #ef6c00}
.price .from,.price .to,.price .unit{font-size:11px;display:block}.price .num{font-size:22px;display:block}
.footer{background:#5c3a1e;color:#ffe082;text-align:center;padding:10px;font-weight:700;font-size:14px}
.tpl-night .footer{background:#0d1b2a;color:#ffd54f}.tpl-farm .footer{background:#1b5e20;color:#fff}
.tpl-souq .footer{background:#bf360c;color:#fff}.tpl-minimal .footer{background:#111;color:#fff}.tpl-minimal .red-ribbon{clip-path:none;background:#111}
.tpl-night .wood-plank{background:linear-gradient(#3d2b12,#1a1208);border-color:#ffd54f}
.tpl-farm .wood-plank{background:linear-gradient(#66bb6a,#1b5e20);border-color:#0d3b12}
.tpl-souq .wood-plank{background:linear-gradient(#ff7043,#bf360c);border-color:#7f1d00}
.tpl-minimal .wood-plank{background:#fff;border:3px solid #111;border-radius:0;box-shadow:8px 8px 0 #111}
.tpl-minimal .souq-word,.tpl-minimal .rabaa-word{color:#111;text-shadow:none}
.plist{padding:8px 22px 18px}
.layout-menu{display:grid;grid-template-columns:1fr 1fr;gap:0 48px;background:#fffdf7;margin:0 22px 18px;padding:8px 18px;border-radius:12px}
.menu-row{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dotted #c4a574}
.menu-row .emo{width:64px;height:48px;border-radius:8px;overflow:hidden}.menu-row .prod{font-size:32px}
.menu-row .nm{font-weight:800;font-size:18px;color:#1b5e20}
.menu-row .pr{font-weight:900;color:#c62828;font-size:22px;text-align:left;min-width:90px}.menu-row .pr small{display:block;font-size:11px;color:#6d4c41;font-weight:700}
.layout-tags{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tag-card{background:#ffeb3b;border-radius:6px 6px 16px 16px;text-align:center;padding:18px 8px 0;box-shadow:0 10px 0 #9a0007;position:relative;min-height:198px;overflow:hidden}
.tag-card::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;background:#2b2b2b}
.tag-card:nth-child(even){background:#e53935;color:#fff}.tag-card:nth-child(even) h3{color:#fff}
.tag-card:nth-child(odd) .tag-price-wrap{background:#e53935;color:#fff}.tag-card:nth-child(even) .tag-price-wrap{background:#ffeb3b;color:#111}
.tag-card h3{font-size:22px;margin:16px 0 2px}.tag-card .emo{display:block;height:72px;margin:0 auto;width:88%;border-radius:10px;overflow:hidden}.tag-card .prod{font-size:48px}
.tag-price-wrap{margin-top:10px;padding:10px 8px 14px}.tag-price{font-size:34px;font-weight:900;line-height:1}.tag-price small{display:block;font-size:12px;font-weight:700}
.layout-table{width:calc(100% - 44px);margin:0 22px 18px;border-collapse:collapse;background:#fff}
.layout-table th{background:#2e7d32;color:#fff;padding:8px}.layout-table.fruit th{background:#6a1b9a}
.layout-table td{border-bottom:1px solid #eee;padding:8px 10px;font-weight:700}.layout-table td.pr{color:#c62828;font-weight:900;font-size:20px}
.layout-table tr:nth-child(even) td{background:#fff8e1}
</style>
</head>
<body>
<div class="app">
<aside class="editor">
<h1>سوق الرابعة</h1>
<p class="hint">اضغط قالب الهيدر وقالب الأسعار. صور الأصناف تظهر داخل الكروت.</p>
<label>قوالب الهيدر</label><div class="tpls" id="tpls"></div>
<label>قوالب عرض الأسعار</label><div class="price-tpls" id="priceTpls"></div>
<label>عنوان السوق</label><input id="titleSouq" />
<label>الاسم البارز</label><input id="titleName" />
<label>جملة الشريط الأحمر</label><input id="ribbon" />
<label>نص أسفل الإعلان (Footer)</label><input id="footerText" />
<label>ملصق اليوم</label><input id="dateText" />
<label>الدائرة</label><input id="circleText" />
<label>اللافتة</label><input id="hangText" />
<div class="btns"><button class="btn-x" onclick="exportImage()">تصدير PNG</button><button class="btn-ok" onclick="saveData()">حفظ</button></div>
<div class="btns"><button class="btn-d" onclick="undo()">تراجع</button><button class="btn-d" onclick="resetData()">القالب الأصلي</button></div>
<div class="status" id="status"></div>
<div class="sec-title">أسعار الخضروات</div><div id="vegEditor"></div>
<div class="sec-title p">أسعار الفواكه واللحوم</div><div id="fruitEditor"></div>
</aside>
<div class="preview-wrap">
<div class="toolbar"><button class="btn-x" onclick="exportImage()">تصدير الإعلان كصورة</button></div>
<div id="flyer" class="tpl-classic"></div>
</div>
</div>
<script>
const TPLS=[{id:"classic",name:"الأصلي"},{id:"masry",name:"خشبي"},{id:"night",name:"ليلي"},{id:"farm",name:"مزرعة"},{id:"souq",name:"شعبي"},{id:"minimal",name:"مينيمال"}];
const PRICE_TPLS=[{id:"cards",name:"كروت الأسعار"},{id:"menu",name:"قائمة سوبرماركت"},{id:"tags",name:"ملصقات كبيرة"},{id:"table",name:"جدول أسعار"}];
const COLORS={"البطاطس":"#fff3e0","الطماطم":"#ffebee","الجزر":"#fff8e1","الباذنجان الحشو":"#f1f8e9","الباذنجان الأسود":"#f3e5f5","الفلفل":"#e8f5e9","الخيار":"#e8f5e9","الكوسة":"#f1f8e9","الليمون":"#fffde7","البطاطا (طين)":"#efebe9","بطاطا تصدير":"#fff8e1","الفراخ":"#fff3e0","الموز":"#fffde7","العنب":"#f3e5f5","المانجو":"#fff8e1","التين الشوكي":"#fce4ec","التين":"#ede7f6"};
const DEFAULT_POS={date:{x:24,y:28},mega:{x:210,y:18},basket:{x:200,y:24},hang:{x:28,y:150},circle:{x:30,y:120},sign:{x:260,y:70}};
const VEG=[{name:"البطاطس",min:"15",max:"20",emoji:"🥔"},{name:"الطماطم",min:"10",max:"15",emoji:"🍅"},{name:"الجزر",min:"10",max:"",emoji:"🥕"},{name:"الباذنجان الحشو",min:"10",max:"",emoji:"🥒"},{name:"الباذنجان الأسود",min:"10",max:"",emoji:"🍆"},{name:"الفلفل",min:"10",max:"15",emoji:"🫑"},{name:"الخيار",min:"10",max:"15",emoji:"🥒"},{name:"الكوسة",min:"20",max:"",emoji:"🥬"},{name:"الليمون",min:"15",max:"40",emoji:"🍋"},{name:"البطاطا (طين)",min:"15",max:"",emoji:"🍠"},{name:"بطاطا تصدير",min:"15",max:"",emoji:"🥔"}];
const FRUIT=[{name:"الفراخ",min:"68",max:"70",emoji:"🐔"},{name:"الموز",min:"35",max:"",emoji:"🍌"},{name:"العنب",min:"35",max:"45",emoji:"🍇"},{name:"المانجو",min:"40",max:"50",emoji:"🥭"},{name:"التين الشوكي",min:"5",max:"",emoji:"🏵"},{name:"التين",min:"40",max:"",emoji:"🟤"}];
function clone(o){return JSON.parse(JSON.stringify(o))}
const DEFAULTS=()=>({template:"classic",priceLayout:"cards",titleSouq:"سوق",titleName:"الرابعة",ribbon:"لمتابعين صفحة بورصة السادات",footerText:"بورصة السادات — متوسط أسعار سوق الرابعة · للتحديث اليومي تابع الصفحة",dateText:"اليوم",circleText:"أكبر صفحة لأسعار السوق في مدينة السادات",hangText:"متابعة يومية لأفضل الأسعار والعروض",pos:clone(DEFAULT_POS),veg:clone(VEG),fruit:clone(FRUIT)});
let state=DEFAULTS(),history=[];
const LS="souq-rabaa-v6";
const FIELDS=["titleSouq","titleName","ribbon","footerText","dateText","circleText","hangText"];
function snap(){history.push(JSON.stringify(state));if(history.length>30)history.shift()}
function undo(){if(!history.length)return setStatus("لا يوجد تراجع");state=JSON.parse(history.pop());bind();render();setStatus("تم التراجع")}
function load(){try{const r=localStorage.getItem(LS);if(r)state=Object.assign(DEFAULTS(),JSON.parse(r))}catch(e){}bind();render()}
function saveData(){collect();localStorage.setItem(LS,JSON.stringify(state));setStatus("تم الحفظ")}
function resetData(){if(!confirm("الرجوع للقالب الأصلي؟"))return;snap();localStorage.removeItem(LS);state=DEFAULTS();bind();render();setStatus("تم الرجوع للأصل")}
function setStatus(t){const el=document.getElementById("status");el.textContent=t;setTimeout(()=>{if(el.textContent===t)el.textContent=""},2000)}
function bind(){FIELDS.forEach(k=>{const el=document.getElementById(k);el.value=state[k]||"";el.oninput=()=>{collect();renderFlyer()}});
const ht={classic:"#c48a4a",masry:"#8d6e63",night:"#0d1b2a",farm:"#2e7d32",souq:"#bf360c",minimal:"#ddd"};
const pt={cards:"#ffecb3",menu:"#e8f5e9",tags:"#ffeb3b",table:"#eee"};
document.getElementById("tpls").innerHTML=TPLS.map(t=>`<div class="tpl ${state.template===t.id?"on":""}" onclick="chooseTpl('${t.id}')"><div class="thumb" style="background:${ht[t.id]}">${t.name}</div><span>${t.name}</span></div>`).join("");
document.getElementById("priceTpls").innerHTML=PRICE_TPLS.map(t=>`<div class="tpl ${state.priceLayout===t.id?"on":""}" onclick="choosePriceTpl('${t.id}')"><div class="thumb" style="background:${pt[t.id]}">${t.name}</div><span>${t.name}</span></div>`).join("")}
function chooseTpl(id){snap();state.template=id;bind();renderFlyer()}
function choosePriceTpl(id){snap();state.priceLayout=id;bind();renderFlyer()}
function collect(){FIELDS.forEach(k=>state[k]=document.getElementById(k).value);
state.veg.forEach((p,i)=>{p.name=document.getElementById("v-n-"+i).value;p.min=document.getElementById("v-min-"+i).value;p.max=document.getElementById("v-max-"+i).value});
state.fruit.forEach((p,i)=>{p.name=document.getElementById("f-n-"+i).value;p.min=document.getElementById("f-min-"+i).value;p.max=document.getElementById("f-max-"+i).value})}
function editors(){const row=(list,pre)=>list.map((p,i)=>`<div class="row3"><input id="${pre}-n-${i}" value="${p.name}"/><input id="${pre}-min-${i}" value="${p.min}"/><input id="${pre}-max-${i}" value="${p.max}"/></div>`).join("");
document.getElementById("vegEditor").innerHTML=row(state.veg,"v");document.getElementById("fruitEditor").innerHTML=row(state.fruit,"f");
document.querySelectorAll(".editor input").forEach(inp=>{if(FIELDS.includes(inp.id))return;inp.addEventListener("input",()=>{collect();renderFlyer()})})}
function productPic(p){return `<span class="prod" style="background:${COLORS[p.name]||"#f1f8e9"}">${p.emoji||"🛒"}</span>`}
function priceHTML(p){if(p.max&&p.max!==p.min)return `<span class="from">من</span><span class="num">${p.min}</span><span class="to">إلى ${p.max}</span><span class="unit">جنيه</span>`;return `<span class="num">${p.min}</span><span class="unit">جنيه</span>`}
function card(p){return `<article class="card"><h3>${p.name}</h3><div class="pic">${productPic(p)}</div><div class="price">${priceHTML(p)}</div></article>`}
function rangeText(p){return(p.max&&p.max!==p.min)?`${p.min}–${p.max}`:(p.min||"—")}
function menuRow(p){return `<div class="menu-row"><div class="emo">${productPic(p)}</div><div class="nm">${p.name}</div><div class="pr">${rangeText(p)}<small>جنيه / كيلو</small></div></div>`}
function tagCard(p){return `<div class="tag-card"><h3>${p.name}</h3><span class="emo">${productPic(p)}</span><div class="tag-price-wrap"><div class="tag-price">${rangeText(p)}<small>جنيه / كيلو</small></div></div></div>`}
function tableBlock(list,cls){return `<table class="layout-table ${cls||""}"><thead><tr><th>الصنف</th><th>السعر</th></tr></thead><tbody>${list.map(p=>`<tr><td>${p.emoji} ${p.name}</td><td class="pr">${rangeText(p)} جنيه</td></tr>`).join("")}</tbody></table>`}
function pricesHTML(list,three){const L=state.priceLayout||"cards";if(L==="menu")return `<div class="plist layout-menu">${list.map(menuRow).join("")}</div>`;if(L==="tags")return `<div class="plist layout-tags">${list.map(tagCard).join("")}</div>`;if(L==="table")return tableBlock(list,three?"fruit":"");return `<div class="grid ${three?"three":""}">${list.map(card).join("")}</div>`}
function posStyle(k){const p=state.pos[k]||DEFAULT_POS[k];const fromRight=(k==="date"||k==="mega"||k==="hang");return fromRight?`right:${p.x}px;top:${p.y}px`:`left:${p.x}px;top:${p.y}px`}
function renderFlyer(){const f=document.getElementById("flyer");f.className="tpl-"+state.template;f.innerHTML=`<div class="header" id="headerZone"><div class="drag mega" data-k="mega" style="${posStyle("mega")}">📣</div><div class="drag badge-today" data-k="date" style="${posStyle("date")}">${state.dateText}</div><div class="drag basket" data-k="basket" style="${posStyle("basket")}">🧺🥗</div><div class="drag hang-left" data-k="hang" style="${posStyle("hang")}">${state.hangText}</div><div class="drag circle-right" data-k="circle" style="${posStyle("circle")}">${state.circleText}</div><div class="drag wood-sign" data-k="sign" style="${posStyle("sign")}"><div class="wood-plank"><div class="souq-word">${state.titleSouq}</div><div class="rabaa-word">${state.titleName}</div></div></div></div><div class="red-ribbon">${state.ribbon}</div><div class="bar green">أسعار الخضروات</div>${pricesHTML(state.veg,false)}<div class="bar purple">أسعار الفواكه واللحوم</div>${pricesHTML(state.fruit,true)}<div class="footer">${state.footerText||""}</div>`;bindDrag()}
function render(){editors();renderFlyer()}
let dragging=null,start=null,didSnap=false;
function bindDrag(){document.querySelectorAll("#headerZone .drag").forEach(el=>el.addEventListener("pointerdown",onDown))}
function onDown(e){const el=e.currentTarget;dragging=el;didSnap=false;el.classList.add("hold");const k=el.dataset.k;const p=state.pos[k];start={px:e.clientX,py:e.clientY,x:p.x,y:p.y,k};el.setPointerCapture(e.pointerId);window.addEventListener("pointermove",onMove);window.addEventListener("pointerup",onUp)}
function onMove(e){if(!dragging||!start)return;if(!didSnap){snap();didSnap=true}const dx=e.clientX-start.px,dy=e.clientY-start.py;const fromRight=(start.k==="date"||start.k==="mega"||start.k==="hang");state.pos[start.k].x=Math.max(0,start.x+(fromRight?-dx:dx));state.pos[start.k].y=Math.max(0,start.y+dy);const p=state.pos[start.k];if(fromRight)dragging.style.right=p.x+"px";else dragging.style.left=p.x+"px";dragging.style.top=p.y+"px"}
function onUp(){if(dragging)dragging.classList.remove("hold");dragging=null;start=null;window.removeEventListener("pointermove",onMove);window.removeEventListener("pointerup",onUp)}
async function exportImage(){collect();renderFlyer();setStatus("جارٍ تجهيز الصورة...");try{const canvas=await html2canvas(document.getElementById("flyer"),{scale:2,useCORS:true,backgroundColor:"#fff6d9"});const a=document.createElement("a");a.download="souq-rabaa-"+new Date().toISOString().slice(0,10)+".png";a.href=canvas.toDataURL("image/png");a.click();setStatus("تم تنزيل الصورة")}catch(err){console.error(err);setStatus("تعذّر التصدير")}}
load();
