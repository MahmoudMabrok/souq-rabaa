<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>قالب سوق الرابعة — بورصة السادات</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>window.TPL_IMGS=window.TPL_IMGS||{};window.PRODUCT_IMGS=window.PRODUCT_IMGS||{};</script>
  <script src="souq-images.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Cairo,sans-serif;background:#1a1a1a;color:#eee}
    .app{display:grid;grid-template-columns:330px 1fr;min-height:100vh}
    @media(max-width:980px){.app{grid-template-columns:1fr}}
    .editor{background:#141414;padding:16px 14px 40px;overflow-y:auto;max-height:100vh;border-left:1px solid #333}
    h1{font-size:18px;color:#ffd54f;margin-bottom:6px}
    .hint{font-size:12px;color:#aaa;line-height:1.6;margin-bottom:12px}
    label{display:block;font-size:12px;color:#bbb;margin:8px 0 4px}
    input,select{width:100%;padding:8px;border-radius:8px;border:1px solid #444;background:#222;color:#fff;font-family:inherit}
    .row3{display:grid;grid-template-columns:1fr 64px 64px;gap:6px;margin-bottom:6px}
    button{font-family:inherit;font-weight:800;border:0;border-radius:10px;padding:10px;cursor:pointer;font-size:14px}
    .btn-x{background:#ff7a00;color:#111}.btn-ok{background:#2e7d32;color:#fff}.btn-d{background:#333;color:#ddd}
    .btns{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.btns button{flex:1}
    .status{min-height:16px;font-size:12px;color:#8bc34a;text-align:center}
    .tpls,.price-tpls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
    .tpl{border:2px solid #333;border-radius:10px;overflow:hidden;cursor:pointer;background:#222}
    .tpl.on{border-color:#ff9800}.tpl img{width:100%;height:72px;object-fit:cover;display:block}
    .tpl span{display:block;padding:4px 6px;font-size:11px;font-weight:800}
    .thumb{height:72px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#111}
    .preview-wrap{padding:20px;background:#2b2b2b;overflow:auto}
    .toolbar{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
    #flyer{width:1080px;margin:0 auto;background:linear-gradient(#fff6d9,#ffe8b0);color:#222;overflow:hidden;position:relative;box-shadow:0 20px 60px #0007}
    .header{position:relative;height:420px;overflow:hidden}
    .header-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none}
    .tpl-classic .header{background:linear-gradient(180deg,rgba(0,0,0,.12),transparent 40%,#fff6d9 100%),radial-gradient(ellipse at 20% 40%,#ffcc80,transparent 50%),#ffecb3}
    .tpl-masry .header{background:linear-gradient(#e8c27a,#c48a4a)}
    .tpl-night .header{background:radial-gradient(circle at 70% 20%,#30465f,#0d1b2a)}
    .tpl-farm .header{background:linear-gradient(#81c784,#2e7d32)}
    .tpl-souq .header{background:linear-gradient(#ff7043,#bf360c)}
    .tpl-minimal .header{background:#fff;height:280px;border-bottom:4px solid #111}
    #flyer.tpl-night{background:linear-gradient(#1b2838,#0d1b2a)}
    #flyer.tpl-farm{background:linear-gradient(#e8f5e9,#c8e6c9)}
    #flyer.tpl-souq{background:linear-gradient(#fff3e0,#ffccbc)}
    #flyer.tpl-minimal{background:#fafafa}
    .drag{position:absolute;z-index:5;cursor:move;user-select:none;touch-action:none}
    .drag.hold{outline:2px dashed #ff9800;z-index:9}
    .badge-today{background:#e31c23;color:#fff;font-weight:900;font-size:28px;padding:8px 22px 10px;border-radius:8px;transform:rotate(-8deg);box-shadow:4px 6px 0 #8b0000}
    .mega{font-size:54px}.wood-sign{width:560px;text-align:center}
    .wood-plank{background:linear-gradient(#c48a4a,#8b5a2b 40%,#6d4018);border:6px solid #5c3a1e;border-radius:18px;padding:10px 20px 22px;box-shadow:0 14px 0 #3e2410}
    .souq-word{font-size:42px;font-weight:900;color:#2e7d32;letter-spacing:6px;text-shadow:2px 2px 0 #fff,0 4px 0 #1b5e20;line-height:1}
    .rabaa-word{font-size:92px;font-weight:900;line-height:.85;color:#ff3d00;text-shadow:3px 3px 0 #fff,6px 8px 0 #b71c1c}
    .hang-left{width:168px;background:#f3e0b8;border:4px solid #8b5a2b;border-radius:8px;padding:12px 10px;text-align:center;font-weight:800;font-size:16px;line-height:1.45;box-shadow:0 8px 0 #5c3a1e}
    .circle-right{width:176px;height:176px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#ffe082);border:6px solid #fff;box-shadow:0 8px 0 #c62828;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font-weight:900;font-size:16px;line-height:1.4;color:#b71c1c}
    .basket{font-size:72px}
    .red-ribbon{position:relative;z-index:6;margin:-36px auto 0;width:78%;background:linear-gradient(#ff1744,#c62828);color:#fff;text-align:center;padding:10px 20px 14px;font-size:30px;font-weight:900;clip-path:polygon(3% 0,97% 0,100% 50%,97% 100%,3% 100%,0 50%);text-shadow:0 3px 0 #7f0000}
    .bar{margin:14px 24px 10px;text-align:center;padding:8px 16px;border-radius:30px;color:#fff;font-weight:900;font-size:26px}
    .bar.green{background:linear-gradient(#66bb6a,#2e7d32)}.bar.purple{background:linear-gradient(#ab47bc,#6a1b9a)}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:8px 22px 18px}.grid.three{grid-template-columns:repeat(3,1fr)}
    .card{background:#fff;border:3px solid #c8e6c9;border-radius:18px;padding:10px 8px 12px;text-align:center;position:relative;min-height:196px;box-shadow:0 6px 0 #e8f5e9}
    .card h3{font-size:18px;font-weight:900;margin-bottom:6px;color:#1b5e20}
    .pic{height:110px;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
    .pic img{width:100%;height:100%;object-fit:cover;display:block}
    .price{position:absolute;left:10px;bottom:10px;background:#ffd54f;border:2px solid #f9a825;border-radius:10px;min-width:62px;padding:3px 7px 5px;font-weight:900;color:#b71c1c;line-height:1.15;box-shadow:2px 3px 0 #ef6c00}
    .price .from,.price .to,.price .unit{font-size:11px;display:block}.price .num{font-size:22px;display:block}
    .footer{background:#5c3a1e;color:#ffe082;text-align:center;padding:10px;font-weight:700;font-size:14px}
    .tpl-night .footer{background:#0d1b2a;color:#ffd54f}.tpl-farm .footer{background:#1b5e20;color:#fff}
    .tpl-souq .footer{background:#bf360c;color:#fff}.tpl-minimal .footer{background:#111;color:#fff}.tpl-minimal .red-ribbon{clip-path:none;background:#111}
    .sign-night{min-width:520px;text-align:center;padding:18px 28px;background:linear-gradient(#1b2838,#0d1b2a);border:4px solid #ffd54f;box-shadow:0 0 24px #ffd54f88,0 16px 0 #000;border-radius:6px}
    .sign-night .souq-word{color:#ffd54f;text-shadow:none;font-size:28px;letter-spacing:10px}
    .sign-night .rabaa-word{color:#fff;text-shadow:0 0 12px #ffd54f;font-size:72px}
    .sign-farm{min-width:520px;text-align:center;padding:16px 24px;background:#1b5e20;border:8px solid #8d6e63;border-radius:8px}
    .sign-souq{min-width:540px;text-align:center;padding:8px 20px 20px;background:#e53935;clip-path:polygon(6% 0,94% 0,100% 100%,0 100%)}
    .sign-minimal{min-width:480px;text-align:center;padding:16px 28px;background:#fff;border:3px solid #111;box-shadow:10px 10px 0 #111}
    .sec-box{background:#1c1c1c;border:1px solid #333;border-radius:10px;padding:8px;margin-bottom:10px}
    .sec-head{display:flex;gap:6px;margin-bottom:6px}.sec-head input{flex:1}.mini{padding:6px 8px;font-size:12px;border-radius:8px}
    .plist{padding:8px 22px 18px}
    .layout-menu{display:grid;grid-template-columns:1fr 1fr;gap:0 48px;background:#fffdf7;margin:0 22px 18px;padding:8px 18px;border-radius:12px}
    .menu-row{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dotted #c4a574}
    .menu-row .emo{width:64px;height:48px;border-radius:8px;overflow:hidden}.menu-row .emo img{width:100%;height:100%;object-fit:cover}
    .menu-row .nm{font-weight:800;font-size:18px;color:#1b5e20}.menu-row .pr{font-weight:900;color:#c62828;font-size:22px}
    .layout-tags{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .tag-card{background:#ffeb3b;border-radius:6px 6px 16px 16px;text-align:center;padding:18px 8px 0;box-shadow:0 10px 0 #9a0007;position:relative;min-height:198px;overflow:hidden}
    .tag-card h3{font-size:22px;margin:16px 0 2px}.tag-card .emo{display:block;height:72px;margin:0 auto;width:88%;border-radius:10px;overflow:hidden}
    .tag-card .emo img{width:100%;height:100%;object-fit:cover}.tag-price-wrap{margin-top:10px;padding:10px 8px 14px}
    .layout-table{width:calc(100% - 44px);margin:0 22px 18px;border-collapse:collapse;background:#fff}
    .layout-table th{background:#2e7d32;color:#fff;padding:8px}.layout-table td{border-bottom:1px solid #eee;padding:8px 10px;font-weight:700}
    .layout-table td.pr{color:#c62828;font-weight:900;font-size:20px}
    .picker{display:none;position:fixed;inset:0;background:#0009;z-index:40;align-items:center;justify-content:center;padding:16px}
    .picker.show{display:flex}
    .picker-box{width:min(860px,96vw);max-height:88vh;overflow:auto;background:#1b1b1b;border:1px solid #444;border-radius:16px;padding:14px}
    .picker-box h2{color:#ffd54f;font-size:18px;margin-bottom:8px}
    .pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
    .pick-card{background:#222;border:1px solid #444;border-radius:10px;padding:6px;color:#fff;text-align:center}
    .pick-card img{width:100%;height:72px;object-fit:cover;border-radius:8px;display:block}
    .pick-card .emo{display:block;font-size:32px;height:72px;line-height:72px}
    .pick-card b{display:block;font-size:12px;margin-top:4px}
    .pick-custom{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
  </style>
</head>
<body>
<div class="app">
<aside class="editor">
<h1>سوق الرابعة</h1>
<p class="hint">اضغط «إضافة صنف من الكتالوج» واختر صورة جاهزة أو ارفع صورة من جهازك.</p>
<label>قوالب الهيدر</label><div class="tpls" id="tpls"></div>
<label>قوالب عرض الأسعار</label><div class="price-tpls" id="priceTpls"></div>
<label>عنوان السوق</label><input id="titleSouq" />
<label>الاسم البارز</label><input id="titleName" />
<label>جملة الشريط الأحمر</label><input id="ribbon" />
<label>نص أسفل الإعلان (Footer)</label><input id="footerText" />
<label>ملصق اليوم</label><input id="dateText" />
<label>الدائرة</label><input id="circleText" />
<label>اللافتة</label><input id="hangText" />
<div class="btns"><button class="btn-x" onclick="exportImage()">تصدير PNG</button><button class="btn-ok" onclick="saveData()">حفظ</button></div>
<div class="btns"><button class="btn-d" onclick="undo()">تراجع</button><button class="btn-d" onclick="resetData()">القالب الأصلي</button></div>
<div class="status" id="status"></div>
<div class="btns"><button class="btn-ok" onclick="addSection()">إضافة قسم</button></div>
<div id="sectionsEditor"></div>
</aside>
<div class="preview-wrap">
<div class="toolbar"><button class="btn-x" onclick="exportImage()">تصدير الإعلان كصورة</button></div>
<div id="flyer" class="tpl-classic"></div>
</div>
</div>
<div id="picker" class="picker" onclick="if(event.target.id==='picker')closePicker()">
  <div class="picker-box" onclick="event.stopPropagation()">
    <h2>اختر صورة الصنف</h2>
    <input id="pickerSearch" placeholder="بحث عن صنف..." />
    <div class="pick-custom">
      <input id="customName" placeholder="اسم الصنف لو هترفع صورة من جهازك" />
      <label class="btn-ok mini" style="display:flex;align-items:center;justify-content:center;padding:8px 12px">رفع صورة
        <input type="file" accept="image/*" hidden onchange="pickCustomFile(this)" />
      </label>
    </div>
    <div id="pickerGrid" class="pick-grid"></div>
    <div class="btns"><button class="btn-d" onclick="closePicker()">إغلاق</button></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
